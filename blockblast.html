<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b1b72;--bg2:#120b36;--panel:#0f0a2c;--cell:#1f1656;--edge:#4a39b0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;}
body{
  font-family:'Lilita One','Zen Maru Gothic',system-ui,sans-serif;color:#fff;letter-spacing:.02em;
  background:radial-gradient(120% 60% at 50% -10%,#5a3bd6 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#c2379d55 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));
  display:flex;justify-content:center;align-items:flex-start;overflow:hidden;user-select:none;-webkit-user-select:none;
}
.stage{--bw:clamp(240px,min(100vw - 24px,380px,100dvh - 300px),380px);width:var(--bw);padding:12px 0;display:flex;flex-direction:column;gap:10px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
h1{margin:0;font-size:25px;font-weight:400;line-height:1;text-transform:uppercase;text-shadow:0 3px 0 #0006;}
h1 span{background:linear-gradient(180deg,#ffe066,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:6px;}
.ib{width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;border-bottom:4px solid #0a0620;border-radius:12px;background:linear-gradient(180deg,#5b47d0,#3e2ba8);color:#fff;cursor:pointer;}
.grp{display:flex;gap:6px;}
.ib:disabled{opacity:.35;cursor:default;}
.ib:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px;}
.ib svg{width:20px;height:20px;}
#snd .x{display:none;}#snd.off .x{display:block;}#snd.off .w{opacity:.35;}
.scores{display:flex;gap:8px;}
.sc{flex:1;padding:6px 12px 5px;border-radius:14px;background:#0f0a2ccc;border:2px solid var(--edge);box-shadow:inset 0 0 18px #6a4dff33;}
.sc small{display:flex;align-items:center;gap:4px;font-size:11px;color:#a99cff;letter-spacing:.12em;}
.sc b{display:block;font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;}
.sc.lv{flex:.55;}.sc.lv small{color:#7df0ad;}.sc.lv b{color:#8ff0b6;}.sc.best{flex:.8;}.sc.best small{color:#ffd54a;}.sc.best b{color:#ffe066;}
.sc svg{width:13px;height:13px;}
.sc b.bump{animation:bump .25s ease-out;}
@keyframes bump{50%{transform:scale(1.18);color:#ffe066;}}
.boardwrap{position:relative;}
#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;padding:7px;background:var(--panel);border:3px solid var(--edge);border-radius:20px;box-shadow:0 0 0 3px #0a0722,0 14px 30px #0008,inset 0 0 30px #6a4dff2a;touch-action:none;}
#board.shake{animation:shake .32s;}
@keyframes shake{20%{transform:translate(-4px,2px);}40%{transform:translate(4px,-2px);}60%{transform:translate(-3px,-1px);}80%{transform:translate(2px,1px);}}
.cell{border-radius:7px;background:var(--cell);box-shadow:inset 0 0 0 1px #ffffff08;}
.cell.alt{background:#241a60;}
.cell.f{box-shadow:inset 0 -4px 0 #0000003d,inset 0 3px 0 #ffffff70,inset 0 0 0 1px #ffffff22;}
.cell.pv{background:var(--pv);opacity:.62;}
.cell.hint{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 40px #ffffff55;}
.cell.clr{animation:clr .3s ease-in forwards;z-index:2;box-shadow:inset 0 0 0 40px #ffffff99;}
@keyframes clr{0%{transform:scale(1.08);}60%{transform:scale(1);}100%{transform:scale(.1) rotate(70deg);opacity:0;}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5;}
#fx i{position:absolute;border-radius:2px;}
#toast{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:32px;line-height:1.05;pointer-events:none;opacity:0;z-index:6;text-shadow:0 3px 0 #7a2bd6,0 6px 0 #0004,0 0 22px #ffd54acc;}
#toast small{display:block;font-size:22px;color:#ffe066;}
#toast.show{animation:toast 1s ease-out;}
@keyframes toast{0%{opacity:0;transform:scale(.4);}18%{opacity:1;transform:scale(1.18);}30%{transform:scale(1);}75%{opacity:1;}100%{opacity:0;transform:translateY(-40px) scale(1);}}
#tray{display:flex;gap:8px;}
.slot{flex:1;height:calc(var(--bw) * .3);min-height:84px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#0f0a2caa;border:2px dashed #4a39b0;touch-action:none;cursor:grab;transition:opacity .15s;}
.slot:active{cursor:grabbing;}
.slot.dead{opacity:.4;}.slot.dead .b{background:#888 !important;}
.pc{display:grid;}
.pc .b{border-radius:5px;box-shadow:inset 0 -3px 0 #0000003d,inset 0 2px 0 #ffffff70,inset 0 0 0 1px #ffffff22;}
.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;will-change:transform;}
.btn{font:inherit;font-size:20px;padding:10px 26px 8px;color:#fff;border:0;border-bottom:5px solid #12703a;border-radius:16px;background:linear-gradient(180deg,#5ee08f,#22b35e);text-shadow:0 2px 0 #0004;cursor:pointer;}
.btn:active{transform:translateY(4px);border-bottom-width:1px;}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#0c0726f2;border-radius:20px;text-align:center;z-index:8;}
#over.show{display:flex;animation:fade .3s;}
@keyframes fade{from{opacity:0;}}
#over h2{margin:0;font-weight:400;font-size:32px;text-transform:uppercase;text-shadow:0 3px 0 #7a2bd6;}
#over .big{font-size:58px;line-height:1;background:linear-gradient(180deg,#ffe066,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;}
#over p{margin:0 0 12px;font-size:16px;color:#a99cff;}
#over .rec{display:none;margin:2px 0 4px;padding:3px 12px;border-radius:99px;background:#ffd54a;color:#4a2a00;font-size:14px;}
#over .rec.show{display:block;animation:bump .5s;}
.low #board{box-shadow:0 0 0 3px #0a0722;}.low #board.shake{animation:none;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <button class="ib" id="snd" aria-label="Suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="w" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path class="w" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/><path class="x" d="M3 3l18 18" stroke="#ff8a8a"/></svg></button>
    <h1>Block<span>Blast</span></h1>
    <div class="grp"><button class="ib" id="undo" aria-label="Batalkan" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button><button class="ib" id="restart" aria-label="Ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button></div>
  </div>
  <div class="scores">
    <div class="sc lv"><small>LEVEL</small><b id="lvl">1</b></div>
    <div class="sc"><small>SKOR</small><b id="score">0</b></div>
    <div class="sc best"><small><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>TERBAIK</small><b id="best">0</b></div>
  </div>
  <div class="boardwrap">
    <div id="board"></div>
    <div id="fx"></div>
    <div id="toast"></div>
    <div id="over"><h2>Game Selesai</h2><div class="big" id="overScore">0</div><span class="rec" id="rec">★ Rekor Baru! ★</span><p id="overTxt"></p><button class="btn" id="again">Main Lagi</button></div>
  </div>
  <div id="tray"></div>
</div>
<script>
(function(){
  var N=8, GAP=3, LIFT=70;
  var LOW=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||4)<=2;
  if(LOW)document.documentElement.classList.add('low');
  // [terang, dasar] per warna permata
  var COLORS=[['#ff8a98','#ff4d66'],['#ffc078','#ff8f2e'],['#fff08a','#ffcf1f'],['#7df0ad','#25c76a'],['#8fdcff','#2aa7f5'],['#d3a6ff','#9b54ff']];
  function bg(c){return 'linear-gradient(160deg,'+COLORS[c][0]+','+COLORS[c][1]+')';}
  var BASES=[['1'],['11'],['111'],['1111'],['11111'],['11','11'],['111','111','111'],['111','111'],
    ['10','11'],['10','10','11'],['01','01','11'],['111','010'],['011','110'],['110','011']];
  var WEIGHT=[1,3,3,1,.2,3,.3,1,3,1,1,1,.1,.1];
  var SHAPES=[], seen={};
  function rot(m){var r=[],h=m.length,w=m[0].length;for(var x=0;x<w;x++){var row=[];for(var y=h-1;y>=0;y--)row.push(m[y][x]);r.push(row);}return r;}
  BASES.forEach(function(b,bi){
    var m=b.map(function(r){return r.split('').map(Number);});
    for(var k=0;k<4;k++){var key=m.map(function(r){return r.join('');}).join('|');
      if(!seen[key]){seen[key]=1;SHAPES.push({m:m,c:bi%6,w:WEIGHT[bi]});} m=rot(m);}
  });

  var $=function(id){return document.getElementById(id);};
  var boardEl=$('board'), trayEl=$('tray'), fx=$('fx'), cells=[];
  for(var i=0;i<N*N;i++){var d=document.createElement('div');d.className='cell'+(((i>>3)+i)%2?' alt':'');boardEl.appendChild(d);cells.push(d);}

  var level=1,last=null,grid,pieces,score,best=0,streak,over,busy,drag=null,muted=false,AC=null;
  // Di dalam halaman Stok Opname, rekor ("TERBAIK") milik USER (petugas) dan dikirim dari leaderboard,
  // bukan dari HP. localStorage hanya dipakai kalau game dibuka mandiri.
  var EMB=false;try{EMB=window.parent&&window.parent!==window;}catch(e){}
  try{if(!EMB)best=+localStorage.getItem('blockBlastBest')||0;muted=localStorage.getItem('blockBlastMute')==='1';}catch(e){}
  function saveBest(){if(EMB)return;try{localStorage.setItem('blockBlastBest',best);}catch(e){}}

  // ---- suara sederhana ----
  function tone(f,t,dur,type,v){
    if(muted||!AC)return;var n=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,n);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.14,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+dur+.03);
  }
  function initAudio(){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
  function buzz(ms){try{if(!muted&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
  function syncSnd(){$('snd').classList.toggle('off',muted);}
  $('snd').onclick=function(){initAudio();muted=!muted;try{localStorage.setItem('blockBlastMute',muted?'1':'0');}catch(e){}syncSnd();tone(660,0,.12);};
  window.addEventListener('pointerdown',initAudio,{once:true});

  function fits(m,r,c,g){g=g||grid;
    for(var y=0;y<m.length;y++)for(var x=0;x<m[0].length;x++){
      if(!m[y][x])continue;var rr=r+y,cc=c+x;
      if(rr<0||cc<0||rr>=N||cc>=N||g[rr*N+cc])return false;
    }return true;
  }
  function canAny(p){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(fits(p.m,r,c))return true;return false;}
  var TOTALW=SHAPES.reduce(function(a,b){return a+b.w;},0);
  function rnd(){var t=Math.random()*TOTALW;for(var i=0;i<SHAPES.length;i++){t-=SHAPES[i].w;if(t<=0)return SHAPES[i];}return SHAPES[0];}
  // apakah balok ini bisa melengkapi minimal satu baris/kolom?
  function canClear(p){
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      if(!fits(p.m,r,c))continue;var tmp=grid.slice();
      p.m.forEach(function(row,y){row.forEach(function(v,x){if(v)tmp[(r+y)*N+c+x]=1;});});
      if(fullLines(tmp).n)return true;
    }return false;
  }
  // apakah ketiga balok bisa dipasang berurutan (urutan bebas) di papan g?
  var SB=0;
  function solvable(set,g){
    if(!set.length||++SB>600)return true;
    var trs=[];
    for(var i=0;i<set.length;i++){
      var p=set[i];if(trs.indexOf(p)>=0)continue;trs.push(p);
      var rest=set.filter(function(_,j){return j!==i;});
      for(var r=0;r<N;r++)for(var c=0;c<N;c++){
        if(!fits(p.m,r,c,g))continue;
        var g2=g.slice();
        p.m.forEach(function(row,y){row.forEach(function(v,x){if(v)g2[(r+y)*N+c+x]=1;});});
        if(solvable(rest,g2))return true;
      }
    }
    return false;
  }
  // seberapa banyak baris/kolom yang bisa diratakan balok ini (terbaik dari semua posisi)
  var CLEAR_CHANCE=.95;
  // Nilai kecocokan tiap bentuk terhadap balok yang SUDAH ada di papan:
  // baris/kolom yang bisa diratakan (bobot besar) + seberapa rapat menempel ke balok lain / dinding.
  function scoreShapes(){
    var out=[];
    SHAPES.forEach(function(p){
      var best=-1,bestClr=0;
      for(var r=0;r<N;r++)for(var c=0;c<N;c++){
        if(!fits(p.m,r,c))continue;
        var tmp=grid.slice(),touch=0,H=p.m.length,W=p.m[0].length,y,x;
        for(y=0;y<H;y++)for(x=0;x<W;x++)if(p.m[y][x])tmp[(r+y)*N+c+x]=1;
        for(y=0;y<H;y++)for(x=0;x<W;x++){
          if(!p.m[y][x])continue;
          [[-1,0],[1,0],[0,-1],[0,1]].forEach(function(d){
            var yy=y+d[0],xx=x+d[1];
            if(yy>=0&&yy<H&&xx>=0&&xx<W&&p.m[yy][xx])return;
            var rr=r+yy,cc=c+xx;
            if(rr<0||cc<0||rr>=N||cc>=N)touch+=.5;else if(grid[rr*N+cc])touch+=1;
          });
        }
        var n=fullLines(tmp).n,sc=n*40+touch;
        if(sc>best){best=sc;}
        if(n>bestClr)bestClr=n;
      }
      if(best>=0)out.push({p:p,sc:best,clr:bestClr});
    });
    return out;
  }
  // Cari celah tertutup kecil (<=5 kotak) yang bentuknya persis sama dengan salah satu balok
  function gapPieces(){
    var seenC={},out=[],key=function(m){return m.map(function(r){return r.join('');}).join('|');};
    for(var i=0;i<N*N;i++){
      if(grid[i]||seenC[i])continue;
      var st=[i],cellsG=[];seenC[i]=1;
      while(st.length){var k=st.pop();cellsG.push(k);var y=k/N|0,x=k%N;
        [[y-1,x],[y+1,x],[y,x-1],[y,x+1]].forEach(function(d){
          if(d[0]<0||d[1]<0||d[0]>=N||d[1]>=N)return;var q=d[0]*N+d[1];
          if(!grid[q]&&!seenC[q]){seenC[q]=1;st.push(q);}});
      }
      if(cellsG.length>5)continue;
      var ys=cellsG.map(function(k){return k/N|0;}),xs=cellsG.map(function(k){return k%N;}),
          y0=Math.min.apply(null,ys),x0=Math.min.apply(null,xs),h=Math.max.apply(null,ys)-y0+1,w=Math.max.apply(null,xs)-x0+1,
          m=[];
      for(var a=0;a<h;a++){m.push([]);for(var b=0;b<w;b++)m[a].push(0);}
      cellsG.forEach(function(k){m[(k/N|0)-y0][k%N-x0]=1;});
      var kk=key(m);
      for(var j=0;j<SHAPES.length;j++)if(key(SHAPES[j].m)===kk){out.push(SHAPES[j]);break;}
    }
    return out;
  }
  // Kotak kosong "kantong": minimal 3 sisinya tertutup blok/dinding. Cari balok kecil (<=3 kotak) yang bisa menutupinya.
  function pocketPieces(){
    var out=[];
    for(var i=0;i<N*N;i++){
      if(grid[i])continue;var y=i/N|0,x=i%N,bl=0;
      [[y-1,x],[y+1,x],[y,x-1],[y,x+1]].forEach(function(d){
        if(d[0]<0||d[1]<0||d[0]>=N||d[1]>=N||grid[d[0]*N+d[1]])bl++;});
      if(bl<3)continue;
      SHAPES.forEach(function(p){
        var n=0,ok=false;p.m.forEach(function(r){r.forEach(function(v){n+=v;});});
        if(n>3||out.indexOf(p)>=0)return;
        for(var a=0;a<p.m.length&&!ok;a++)for(var b=0;b<p.m[0].length&&!ok;b++)
          if(p.m[a][b]&&fits(p.m,y-a,x-b))ok=true;
        if(ok)out.push(p);
      });
    }
    return out;
  }
  function inject(s){
    var g=gapPieces(),p=pocketPieces(),idx=[0,1,2].sort(function(){return Math.random()-.5;}),n=0;
    if(g.length)s[idx[n++]]=g[Math.floor(Math.random()*g.length)];
    if(p.length&&n<2)s[idx[n++]]=p[Math.floor(Math.random()*p.length)];
  }
  // Mode "menyesuaikan papan": balok dipilih yang paling pas dengan celah yang ada
  // ---- Perencana: susun 3 balok lurus yang PASTI bisa melengkapi baris/kolom, sehingga papan terus menyusut ----
  function mkey(m){return m.map(function(r){return r.join('');}).join('|');}
  function straight(len,h){
    var k=h?new Array(len+1).join('1'):new Array(len+1).join('1').split('').join('|');
    for(var j=0;j<SHAPES.length;j++)if(mkey(SHAPES[j].m)===k)return SHAPES[j];
    return SHAPES[0];
  }
  function planTray(){
    var g=grid.slice(),out=[],ori=-1;
    function lines(o){
      var arr=[];
      for(var i=0;i<N;i++){
        var f=0,runs=[],cur=0;
        for(var j=0;j<N;j++){
          var v=o?g[j*N+i]:g[i*N+j];
          if(v){f++;if(cur){runs.push(cur);cur=0;}}else cur++;
        }
        if(cur)runs.push(cur);
        var pcs=[];runs.forEach(function(L){while(L>5){pcs.push(5);L-=5;}if(L)pcs.push(L);});
        if(f>0&&pcs.length)arr.push({o:o,i:i,f:f,pcs:pcs});
      }
      return arr;
    }
    for(var guard=0;guard<3&&out.length<3;guard++){
      var slots=3-out.length,cand=[];
      (ori<0?[0,1]:[ori]).forEach(function(o){cand=cand.concat(lines(o));});
      var fit=cand.filter(function(l){return l.pcs.length<=slots;}),pick=null,pool;
      if(fit.length){
        var mx=Math.max.apply(null,fit.map(function(l){return l.f;}));
        pool=fit.filter(function(l){return l.f===mx;});
      }else if(out.length===0&&cand.length){
        var mn=Math.min.apply(null,cand.map(function(l){return l.pcs.length;}));
        pool=cand.filter(function(l){return l.pcs.length===mn;});
      }else break;
      pick=pool[Math.floor(Math.random()*pool.length)];ori=pick.o;
      pick.pcs.slice(0,slots).forEach(function(L){out.push(straight(L,pick.o===0));});
      for(var q=0;q<N;q++){if(pick.o)g[q*N+pick.i]=0;else g[pick.i*N+q]=0;}
    }
    if(!out.length)return null;
    while(out.length<3){
      var p=null,t=0;
      while(t++<40){p=rnd();if(canAny(p))break;p=null;}
      out.push(p||SHAPES[0]);
    }
    return out.sort(function(){return Math.random()-.5;});
  }
  function newPieces(){
    var pp=level<=3?.99:Math.max(.55,.99-.06*(level-3));
    if(Math.random()<pp){var pl=planTray();if(pl){pieces=pl;return;}}
    var filled=grid.reduce(function(a,v){return a+(v?1:0);},0);
    var all=scoreShapes().sort(function(a,b){return b.sc-a.sc;});
    var top=all.slice(0,10);
    var clearPool=all.filter(function(o){return o.clr>0;}).slice(0,7);
    function pickTop(){var k=Math.floor(Math.pow(Math.random(),1.6)*top.length);return top[k].p;}
    var t=0,t0=performance.now(),s,ok,need=Math.random()<CLEAR_CHANCE; // 95% giliran: minimal satu balok bisa meratakan satu baris
    do{
      var fresh=filled<6; // papan hampir kosong: cukup balok kecil acak
      var h=(need&&clearPool.length)?clearPool[Math.floor(Math.random()*clearPool.length)].p:(fresh?rnd():pickTop());
      s=[h,fresh?rnd():pickTop(),fresh?rnd():pickTop()];
      s.sort(function(){return Math.random()-.5;});inject(s);t++;
      SB=0;ok=solvable(s,grid) && (!need || !clearPool.length || (t>15 ? s.some(canClear) : s.filter(canClear).length>=2));
    }while(t<100&&!ok&&performance.now()-t0<14);
    if(!ok){t=0;do{s=[rnd(),rnd(),rnd()];t++;}while(t<40&&!s.every(canAny));inject(s);}
    pieces=s;
  }
  // cari baris/kolom penuh pada grid g; kembalikan {idx:{}, n:jumlah garis}
  function fullLines(g){
    var set={},n=0,y,x,f;
    for(y=0;y<N;y++){f=true;for(x=0;x<N;x++)if(!g[y*N+x])f=false;if(f){n++;for(x=0;x<N;x++)set[y*N+x]=1;}}
    for(x=0;x<N;x++){f=true;for(y=0;y<N;y++)if(!g[y*N+x])f=false;if(f){n++;for(y=0;y<N;y++)set[y*N+x]=1;}}
    return {set:set,n:n};
  }

  function pieceEl(p,size,gap){
    var el=document.createElement('div');el.className='pc';
    el.style.gridTemplateColumns='repeat('+p.m[0].length+','+size+'px)';el.style.gap=gap+'px';
    p.m.forEach(function(row){row.forEach(function(v){
      var d=document.createElement('div');d.style.width=d.style.height=size+'px';
      if(v){d.className='b';d.style.background=bg(p.c);}el.appendChild(d);
    });});return el;
  }
  var shown=[];
  function renderBoard(){
    for(var i=0;i<N*N;i++){var v=grid[i],c=cells[i];
      if(shown[i]===v)continue;shown[i]=v;
      c.className='cell'+(((i>>3)+i)%2?' alt':'')+(v?' f':'');
      c.style.background=v?bg(v-1):'';}
  }
  function renderTray(){
    trayEl.innerHTML='';
    pieces.forEach(function(p,i){
      var s=document.createElement('div');s.className='slot';
      if(p){s.appendChild(pieceEl(p,19,2));if(!canAny(p))s.classList.add('dead');
        s.addEventListener('pointerdown',function(e){startDrag(e,i,s);});}
      trayEl.appendChild(s);
    });
  }
  function bumpEl(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}
  function updateScore(anim){$('score').textContent=score;$('lvl').textContent=level;$('best').textContent=best;if(anim)bumpEl($('score'));}
  function toast(big,small){var e=$('toast');e.innerHTML=big+(small?'<small>'+small+'</small>':'');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}

  function burst(keys,colors){
    var wr=fx.getBoundingClientRect(),o=cells[0].getBoundingClientRect(),pitch=cells[1].getBoundingClientRect().left-o.left,
        bx=o.left-wr.left+(pitch-GAP)/2,by=o.top-wr.top+(pitch-GAP)/2,
        per=(LOW||keys.length>16)?1:2,step=(LOW&&keys.length>10)?2:1;
    keys.forEach(function(k,ki){
      if(ki%step)return;
      var cx=bx+(k%N)*pitch,cy=by+(k/N|0)*pitch;
      for(var j=0;j<per;j++){
        var p=document.createElement('i'),s=5+Math.random()*6;
        p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(cx-s/2)+'px;top:'+(cy-s/2)+'px;background:'+COLORS[colors[k]-1][Math.random()<.5?0:1];
        fx.appendChild(p);
        var dx=(Math.random()-.5)*110,dy=(Math.random()-.7)*110;
        var a=p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+(dy+40)+'px) rotate('+(Math.random()*360)+'deg)',opacity:0}],{duration:520+Math.random()*300,easing:'cubic-bezier(.2,.7,.4,1)'});
        a.onfinish=function(){this.effect.target.remove();};
      }
    });
  }

  var pvList=[];
  function clearPv(){for(var i=0;i<pvList.length;i++)pvList[i].classList.remove('pv','hint');pvList.length=0;}
  function startDrag(e,i,slot){
    if(over||busy||drag)return;e.preventDefault();initAudio();
    var p=pieces[i],o=cells[0].getBoundingClientRect(),pitch=cells[1].getBoundingClientRect().left-o.left;
    var g=pieceEl(p,pitch-GAP,GAP);g.classList.add('ghost');document.body.appendChild(g);
    slot.style.opacity=.25;boardEl.style.setProperty('--pv',COLORS[p.c][1]);
    drag={i:i,p:p,g:g,slot:slot,pitch:pitch,ox:o.left,oy:o.top,w:p.m[0].length*pitch-GAP,h:p.m.length*pitch-GAP,r:-99,c:-99,x:e.clientX,y:e.clientY,raf:0};
    tone(520,0,.06);frame();
    window.addEventListener('pointermove',moveDrag);
    window.addEventListener('pointerup',endDrag);
    window.addEventListener('pointercancel',endDrag);
  }
  function moveDrag(e){if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;if(!drag.raf)drag.raf=requestAnimationFrame(frame);}
  function frame(){
    if(!drag)return;drag.raf=0;
    var p=drag.p,x=drag.x-drag.w/2,y=drag.y-drag.h/2-LIFT;
    drag.g.style.transform='translate3d('+x+'px,'+y+'px,0)';
    var c=Math.round((x-drag.ox)/drag.pitch),r=Math.round((y-drag.oy)/drag.pitch);
    if(r===drag.r&&c===drag.c)return;
    drag.r=r;drag.c=c;clearPv();
    if(!fits(p.m,r,c))return;
    var tmp=grid.slice();
    p.m.forEach(function(row,yy){row.forEach(function(v,xx){
      if(v){var k=(r+yy)*N+c+xx;tmp[k]=1;cells[k].classList.add('pv');pvList.push(cells[k]);}
    });});
    var fl=fullLines(tmp);
    for(var k in fl.set){cells[k].classList.add('hint');pvList.push(cells[k]);}
  }
  function endDrag(){
    if(!drag)return;
    window.removeEventListener('pointermove',moveDrag);
    window.removeEventListener('pointerup',endDrag);
    window.removeEventListener('pointercancel',endDrag);
    if(drag.raf){cancelAnimationFrame(drag.raf);frame();}
    var d=drag;drag=null;d.g.remove();d.slot.style.opacity='';clearPv();
    if(fits(d.p.m,d.r,d.c))place(d.i,d.r,d.c);
  }

  var PRAISE=['','Bagus!','Keren!','Luar Biasa!','GILA!!'];
  function setUndo(){$('undo').disabled=!last||busy;}
  function place(i,r,c){
    last={g:grid.slice(),p:pieces.slice(),s:score,st:streak};
    var p=pieces[i],n=0;
    p.m.forEach(function(row,y){row.forEach(function(v,x){if(v){grid[(r+y)*N+c+x]=p.c+1;n++;}});});
    pieces[i]=null;
    var fl=fullLines(grid),lines=fl.n,gain=n;
    if(lines){streak++;gain+=lines*lines*10+(streak-1)*5;}else streak=0;
    score+=gain;
    if(score>best){best=score;saveBest();}
    renderBoard();renderTray();updateScore(true);setUndo();report();
    if(!lines){tone(300,0,.09);after();return;}
    var keys=Object.keys(fl.set),colors=grid.slice();
    toast(PRAISE[Math.min(lines,4)],'+'+gain+(streak>1?'  ·  x'+streak:''));
    busy=true;setUndo();
    keys.forEach(function(k){cells[k].classList.add('clr');});
    burst(keys,colors);
    for(var t=0;t<Math.min(lines+2,6);t++)tone(440*Math.pow(1.122,t*2),t*.06,.18,'triangle',.13);
    buzz(lines>1?[30,30,60]:30);
    if(lines>1){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');}
    setTimeout(function(){
      keys.forEach(function(k){grid[k]=0;});renderBoard();busy=false;setUndo();
      if(grid.every(function(v){return !v;})){levelUp();return;}
      after();
    },300);
  }
  function after(){
    if(pieces.every(function(p){return !p;}))newPieces();
    renderTray();
    if(!pieces.some(function(p){return p&&canAny(p);}))endGame();
  }
  // Kirim skor ke halaman Stok Opname (leaderboard). Server hanya menyimpan bila lebih tinggi dari skor terbaik pemain.
  function report(final){
    try{ if(typeof score==='number'&&score>0&&window.parent&&window.parent!==window) window.parent.postMessage({type:'blockblast-score',score:score,final:!!final},'*'); }catch(e){}
  }
  function endGame(){
    over=true;report(true);var rec=score>0&&score>=best;
    $('overScore').textContent=score;$('rec').classList.toggle('show',rec);
    $('overTxt').textContent='Level '+level+'  ·  Terbaik: '+best;
    tone(330,0,.25,'sawtooth',.08);tone(247,.2,.25,'sawtooth',.08);tone(196,.4,.45,'sawtooth',.08);
    setTimeout(function(){if(over)$('over').classList.add('show');},350);
  }
  function undo(){
    if(!last||busy||drag)return;
    grid=last.g;pieces=last.p;score=last.s;streak=last.st;last=null;over=false;
    $('over').classList.remove('show');
    renderBoard();renderTray();updateScore();setUndo();tone(400,0,.08);
  }
  function fillLevel(){
    grid=new Array(N*N).fill(0);
    var rc=function(){return 1+Math.floor(Math.random()*6);};
    var k=Math.min(1+((level-1)>>1),3),w=Math.min(2+((level-1)>>1),4),
        r0=Math.floor(Math.random()*(N-k+1)),c0=Math.floor(Math.random()*(N-w+1)),used={};
    for(var y=0;y<k;y++){used[r0+y]=1;var col=rc();
      for(var x=0;x<N;x++)if(x<c0||x>=c0+w)grid[(r0+y)*N+x]=Math.random()<.7?col:rc();}
    var extra=Math.max(0,Math.min(level-3,3));
    while(extra>0){var r=Math.floor(Math.random()*N);if(used[r])continue;used[r]=1;extra--;
      var hole=Math.floor(Math.random()*N),cl=rc();
      for(var x2=0;x2<N;x2++)if(x2!==hole)grid[r*N+x2]=cl;}
  }
  function confetti(){
    var w=fx.getBoundingClientRect();
    for(var i=0;i<(LOW?24:50);i++){
      var p=document.createElement('i'),s=6+Math.random()*7,c=COLORS[i%6][i%2];
      p.style.cssText='width:'+s+'px;height:'+(s*1.4)+'px;left:'+(Math.random()*w.width)+'px;top:-10px;background:'+c;
      fx.appendChild(p);
      var a=p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+((Math.random()-.5)*120)+'px,'+(w.height+120)+'px) rotate('+(Math.random()*900)+'deg)',opacity:.9}],{duration:1300+Math.random()*1100,delay:Math.random()*500,easing:'cubic-bezier(.3,.5,.6,1)',fill:'forwards'});
      a.onfinish=function(){this.effect.target.remove();};
    }
  }
  function levelUp(){
    busy=true;setUndo();var bonus=100*level;score+=bonus;
    if(score>best){best=score;saveBest();}
    updateScore(true);report();confetti();buzz([40,40,80]);
    toast('BERSIH!','+'+bonus+'  ·  Level '+(level+1));
    [523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.09,.3,'triangle',.14);});
    boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');
    setTimeout(function(){
      level++;last=null;fillLevel();newPieces();renderBoard();renderTray();updateScore(true);
      bumpEl($('lvl'));busy=false;setUndo();
      if(!pieces.some(function(p){return p&&canAny(p);}))endGame();
    },1500);
  }
  function start(){
    report(true);
    level=1;last=null;fillLevel();score=0;streak=0;over=false;busy=false;
    $('over').classList.remove('show');
    newPieces();renderBoard();renderTray();updateScore();setUndo();
  }
  $('undo').onclick=undo;$('restart').onclick=start;$('again').onclick=start;
  document.addEventListener('visibilitychange',function(){if(document.hidden)report();});
  window.addEventListener('pagehide',report);
  syncSnd();start();
  // Terima rekor milik user dari halaman Stok Opname
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||d.type!=='blockblast-best'||e.source!==window.parent)return;
    best=Math.max(0,+d.best||0);
    if(typeof score==='number'&&score>best)best=score;
    updateScore();
  });
  if(EMB){try{window.parent.postMessage({type:'blockblast-hello'},'*');}catch(e){}}
})();
</script>
</body>
