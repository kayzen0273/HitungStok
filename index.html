<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NusaSpace Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        };
        // Default terang. Gelap hanya jika pengguna memilihnya.
        try {
            if (localStorage.getItem("nusaspace_theme") === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
    </script>
    <style>
        /* Scrollbar filter kategori dibuat tipis, dengan jarak ke grid */
        #categoryFilters { margin-bottom: 14px; }
        #categoryFilters::-webkit-scrollbar { height: 3px; }
        #categoryFilters::-webkit-scrollbar-track { background: transparent; }
        #categoryFilters::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark #categoryFilters::-webkit-scrollbar-thumb { background: #475569; }
        @supports not selector(::-webkit-scrollbar) {
            #categoryFilters { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

    <header class="border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-3">
            <h1 class="text-lg font-extrabold tracking-tight shrink-0">NusaSpace</h1>
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                <input type="search" id="searchInput" placeholder="Cari modul" aria-label="Cari modul"
                    class="w-full pl-9 pr-3 py-2 bg-slate-100 dark:bg-slate-800 border border-transparent rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
            </div>
            <button id="themeToggle" type="button" aria-label="Ganti tema"
                class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6">
        <div id="categoryFilters" class="flex items-center gap-2 overflow-x-auto pb-4"></div>

        <div id="appGrid" class="grid grid-cols-3 gap-3 sm:gap-4"></div>

        <p id="emptyState" class="hidden py-16 text-center text-sm text-slate-500 dark:text-slate-400">
            Modul tidak ditemukan. Coba kata kunci lain.
        </p>
    </main>

    <!-- Detail modul -->
    <div id="appModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/50"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-6">
            <button id="closeModalBtn" type="button" aria-label="Tutup"
                class="absolute top-3 right-3 p-2 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modalIconBox" class="w-14 h-14 rounded-xl flex items-center justify-center text-white mb-4"></div>
            <h2 id="modalTitle" class="text-lg font-extrabold"></h2>
            <p id="modalCategory" class="text-xs font-semibold text-slate-400 mt-0.5"></p>
            <p id="modalDescription" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mt-3"></p>
            <button id="launchAppBtn" type="button"
                class="mt-6 w-full px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold flex items-center justify-center gap-2">
                Buka modul
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Penampil modul -->
    <div id="moduleViewer" class="fixed inset-0 z-[60] hidden flex-col bg-white dark:bg-slate-950">
        <div class="flex items-center gap-1 px-1.5 py-0.5 border-b border-slate-200 dark:border-slate-800">
            <button id="closeViewerBtn" type="button" aria-label="Kembali ke menu"
                class="p-1.5 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <span id="viewerTitle" class="text-xs font-semibold text-slate-600 dark:text-slate-300 truncate"></span>
        </div>
        <div id="viewerFrames" class="flex-1 relative"></div>
    </div>

    <div id="toast" role="status" aria-live="polite"
        class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 translate-y-20 opacity-0 transition duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium">
            <span id="toastMessage"></span>
        </div>
    </div>

    <script>
        const categoryColor = {
            "Produktivitas": "bg-indigo-600",
            "Komunikasi": "bg-sky-600",
            "Keuangan": "bg-emerald-600",
            "Operasional": "bg-violet-600",
            "Sistem": "bg-slate-600",
            "Hiburan": "bg-pink-600"
        };

        const appMenus = [
            { id: 1, visible: false,  title: "Dasbor",       subtitle: "Ringkasan", category: "Produktivitas", icon: "layout-dashboard", badge: null, desc: "Ringkasan performa harian, metrik utama, dan aktivitas terbaru tim." },
            { id: 2, visible: false,  title: "Tugas",        subtitle: "Kanban & daftar", category: "Produktivitas", icon: "check-square", badge: "12", desc: "Kelola daftar pekerjaan, papan Kanban, tenggat, dan pembagian tugas tim." },
            { id: 3, visible: false,  title: "Kalender",     subtitle: "Agenda tim", category: "Produktivitas", icon: "calendar-days", badge: null, desc: "Atur jadwal rapat dan pengingat, dan lihat ketersediaan rekan kerja." },
            { id: 4, visible: false,  title: "Dokumen",      subtitle: "Catatan & wiki", category: "Produktivitas", icon: "file-text", badge: null, desc: "Tulis catatan rapat, SOP, dan dokumen bersama dengan penyuntingan serentak." },
            { id: 5, visible: false,  title: "Penyimpanan",  subtitle: "Berkas", category: "Produktivitas", icon: "cloud", badge: null, desc: "Simpan dan bagikan berkas dengan hak akses per folder." },
            { id: 6, visible: false,  title: "Pesan",        subtitle: "Obrolan tim", category: "Komunikasi", icon: "message-square", badge: "5", desc: "Diskusi antar divisi lewat kanal dan pesan langsung." },
            { id: 7, visible: false,  title: "Rapat Video",  subtitle: "Konferensi", category: "Komunikasi", icon: "video", badge: null, desc: "Panggilan video dengan berbagi layar dan rekaman rapat." },
            { id: 8, visible: false,  title: "Email",        subtitle: "Kotak masuk", category: "Komunikasi", icon: "mail", badge: "3", desc: "Kelola email berdomain perusahaan, dengan filter spam dan tanda tangan standar." },
            { id: 9, visible: false,  title: "Analitik",     subtitle: "Laporan & grafik", category: "Operasional", icon: "bar-chart-3", badge: null, desc: "Grafik pertumbuhan, tren penjualan, dan metrik bisnis per periode." },
            { id: 10, visible: false, title: "Keuangan",     subtitle: "Pembukuan", category: "Keuangan", icon: "landmark", badge: null, desc: "Catat kas masuk dan keluar, laporan laba rugi, dan pencocokan saldo rekening." },
            { id: 11, visible: false, title: "Invoice",      subtitle: "Penagihan", category: "Keuangan", icon: "receipt", badge: "2", desc: "Buat dan kirim invoice ke klien, lengkap dengan pengingat pembayaran." },
            { id: 12, visible: false, title: "Dompet",       subtitle: "Saldo operasional", category: "Keuangan", icon: "wallet", badge: null, desc: "Kelola saldo dompet digital perusahaan untuk pengeluaran harian." },
            { id: 13, visible: false, title: "Transfer",     subtitle: "Pembayaran", category: "Keuangan", icon: "arrow-left-right", badge: null, desc: "Transfer antar bank, bayar vendor massal, dan lunasi tagihan utilitas." },
            { id: 14, visible: false, title: "Inventaris",   subtitle: "Stok gudang", category: "Operasional", icon: "boxes", badge: null, desc: "Pantau stok di berbagai gudang, peringatan stok menipis, dan pindai barcode." },
            { id: 15, visible: false, title: "Kasir",        subtitle: "Pesanan & POS", category: "Operasional", icon: "shopping-bag", badge: null, desc: "Proses pesanan, cetak struk, dan sinkronkan stok saat transaksi." },
            { id: 16, visible: false, title: "Pelanggan",    subtitle: "CRM", category: "Operasional", icon: "users", badge: null, desc: "Simpan riwayat interaksi pelanggan, segmen loyalitas, dan prospek penjualan." },
            { id: 17, visible: false, title: "Pemasaran",    subtitle: "Promo", category: "Operasional", icon: "megaphone", badge: null, desc: "Rancang kampanye, kirim pesan siaran, dan ukur konversi kupon diskon." },
            { id: 18, visible: false, title: "Media Sosial", subtitle: "Jadwal konten", category: "Komunikasi", icon: "share-2", badge: null, desc: "Jadwalkan konten ke berbagai kanal dan pantau interaksi audiens." },
            { id: 19, visible: false, title: "Absensi",      subtitle: "Kehadiran & cuti", category: "Operasional", icon: "user-check", badge: null, desc: "Rekap kehadiran, pengajuan cuti, lembur, dan direktori karyawan." },
            { id: 20, visible: false, title: "Penggajian",   subtitle: "Payroll", category: "Keuangan", icon: "banknote", badge: null, desc: "Hitung gaji, tunjangan, dan potongan PPh 21, lalu kirim slip gaji digital." },
            { id: 21, visible: false, title: "Bantuan",      subtitle: "Tiket", category: "Komunikasi", icon: "life-buoy", badge: null, desc: "Sistem tiket untuk layanan pelanggan dan bantuan teknis internal." },
            { id: 22, visible: false, title: "Otomatisasi",  subtitle: "Alur kerja", category: "Sistem", icon: "workflow", badge: null, desc: "Otomatiskan pekerjaan berulang dengan aturan pemicu, tanpa menulis kode." },
            { id: 23, visible: false, title: "Integrasi",    subtitle: "API & webhook", category: "Sistem", icon: "blocks", badge: null, desc: "Hubungkan NusaSpace dengan layanan lain lewat kunci API, webhook, dan konektor." },
            { id: 24, visible: false, title: "Keamanan",     subtitle: "2FA & log", category: "Sistem", icon: "shield-check", badge: null, desc: "Atur autentikasi dua faktor, peran pengguna, dan riwayat login perangkat." },
            { id: 25, visible: false, title: "Notifikasi",   subtitle: "Pemberitahuan", category: "Sistem", icon: "bell", badge: "9", desc: "Lihat pemberitahuan dari semua modul dan atur preferensi peringatan." },
            { id: 26, visible: false, title: "Tampilan",     subtitle: "Tema", category: "Sistem", icon: "palette", badge: null, desc: "Ubah warna aksen, kepadatan tata letak, dan mode gelap atau terang." },
            { id: 27, visible: false, title: "Pengaturan",   subtitle: "Akun", category: "Sistem", icon: "settings", badge: null, desc: "Atur profil organisasi, zona waktu, bahasa, dan langganan." },
            { id: 28, visible: true, title: "Stok Opname", subtitle: "Pencatatan barang", category: "Operasional", icon: "package-check", badge: null, url: "stok_opname.html", desc: "Catat hasil hitung fisik barang, bandingkan dengan stok sistem, dan ekspor selisihnya ke Excel." },
            { id: 29, visible: true, title: "Kasir Apotek", subtitle: "Penjualan & stok", category: "Operasional", icon: "shopping-cart", badge: null, url: "kasir_apotek.html", desc: "Kasir apotek dengan mode offline dan sinkronisasi otomatis." },
            { id: 30, visible: true, title: "NebulaHeart", subtitle: "Galaksi cinta", category: "Hiburan", icon: "heart", badge: null, url: "galaxilove.html", desc: "Buat galaksi cinta interaktif berbentuk hati, lalu bagikan lewat tautan khusus ke orang tersayang."},
            { id: 31, visible: true, title: "Photobox", subtitle: "Studio foto instan", category: "Hiburan", icon: "camera", badge: null, url: "photobox-ldr.html", desc: "Studio foto instan dengan kamera, bingkai, dan mode LDR untuk berfoto bersama pasangan jarak jauh." },
            { id: 32, visible: true, title: "KeuanganKu", subtitle: "Catatan keuangan", category: "Keuangan", icon: "piggy-bank", badge: null, url: "keuanganku_firebase.html", desc: "Catat pemasukan dan pengeluaran pribadi, tersinkron real-time lewat Firebase." }
        ];

        const categories = ["Semua", "Produktivitas", "Keuangan", "Komunikasi", "Operasional", "Sistem", "Hiburan", "Dinonaktifkan"];
        let activeCategory = "Semua";
        let searchQuery = "";
        let currentApp = null;
        let lastFocused = null;
        let toastTimer = null;

        const $ = (id) => document.getElementById(id);
        const appGrid = $("appGrid"), emptyState = $("emptyState"), appModal = $("appModal");

        function showToast(msg) {
            $("toastMessage").textContent = msg;
            $("toast").classList.remove("translate-y-20", "opacity-0");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $("toast").classList.add("translate-y-20", "opacity-0"), 2500);
        }

        function renderFilters() {
            $("categoryFilters").innerHTML = categories.map((cat) => {
                const active = cat === activeCategory;
                const cls = active
                    ? "bg-indigo-600 text-white"
                    : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700";
                return `<button type="button" data-category="${cat}" aria-pressed="${active}"
                    class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${cls}">${cat === "Dinonaktifkan" ? `${cat} (${appMenus.filter((a) => !a.visible).length})` : cat}</button>`;
            }).join("");
        }

        function renderGrid() {
            const q = searchQuery.trim().toLowerCase();
            const list = appMenus.filter((app) =>
                (activeCategory === "Dinonaktifkan"
                    ? !app.visible
                    : app.visible && (activeCategory === "Semua" || app.category === activeCategory)) &&
                (!q || app.title.toLowerCase().includes(q) || app.subtitle.toLowerCase().includes(q) || app.desc.toLowerCase().includes(q))
            );

            appGrid.classList.toggle("hidden", list.length === 0);
            emptyState.classList.toggle("hidden", list.length > 0);
            emptyState.textContent = q
                ? "Modul tidak ditemukan. Coba kata kunci lain."
                : activeCategory === "Dinonaktifkan"
                    ? "Tidak ada modul yang dinonaktifkan."
                    : "Semua modul sedang dinonaktifkan. Lihat di tab Dinonaktifkan.";

            appGrid.innerHTML = list.map((app) => `
                <button type="button" data-open="${app.id}" ${app.visible ? "" : "disabled aria-disabled=\"true\""}
                    class="p-3 sm:p-5 flex flex-col items-center text-center rounded-xl border border-slate-200 dark:border-slate-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ${app.visible ? "hover:border-indigo-400 dark:hover:border-indigo-500 hover:bg-slate-50 dark:hover:bg-slate-900" : "opacity-50 grayscale cursor-not-allowed"}">
                    <span class="relative mb-3">
                        <span class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl ${categoryColor[app.category]} text-white flex items-center justify-center">
                            <i data-lucide="${app.icon}" class="w-6 h-6 sm:w-7 sm:h-7"></i>
                        </span>
                        ${app.badge && app.visible ? `<span class="absolute -top-1.5 -right-2 min-w-[18px] px-1.5 py-0.5 text-[10px] font-bold leading-none text-center rounded-full bg-rose-600 text-white border-2 border-white dark:border-slate-950">${app.badge}</span>` : ""}
                    </span>
                    <span class="text-xs sm:text-sm font-bold truncate w-full">${app.title}</span>
                    <span class="text-[11px] sm:text-xs text-slate-400 truncate w-full mt-0.5">${app.subtitle}</span>
                </button>
            `).join("");
            lucide.createIcons();
        }

        function openModal(id) {
            currentApp = appMenus.find((a) => a.id === id);
            if (!currentApp) return;
            if (currentApp.url) { openViewer(currentApp); return; }
            lastFocused = document.activeElement;
            $("modalIconBox").className = `w-14 h-14 rounded-xl flex items-center justify-center text-white mb-4 ${categoryColor[currentApp.category]}`;
            $("modalIconBox").innerHTML = `<i data-lucide="${currentApp.icon}" class="w-7 h-7"></i>`;
            $("modalTitle").textContent = currentApp.title;
            $("modalCategory").textContent = currentApp.category;
            $("modalDescription").textContent = currentApp.desc;
            lucide.createIcons();
            appModal.classList.remove("hidden");
            appModal.classList.add("flex");
            $("launchAppBtn").focus();
        }

        function closeModal() {
            appModal.classList.add("hidden");
            appModal.classList.remove("flex");
            if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
        }

        appGrid.addEventListener("click", (e) => {
            const card = e.target.closest("[data-open]");
            if (card) openModal(Number(card.dataset.open));
        });

        $("categoryFilters").addEventListener("click", (e) => {
            const btn = e.target.closest("[data-category]");
            if (!btn) return;
            activeCategory = btn.dataset.category;
            renderFilters();
            renderGrid();
        });

        $("searchInput").addEventListener("input", (e) => { searchQuery = e.target.value; renderGrid(); });

        $("themeToggle").addEventListener("click", () => {
            const dark = document.documentElement.classList.toggle("dark");
            try { localStorage.setItem("nusaspace_theme", dark ? "dark" : "light"); } catch (e) {}
        });

        $("closeModalBtn").addEventListener("click", closeModal);
        $("modalBackdrop").addEventListener("click", closeModal);
        const viewer = $("moduleViewer"), viewerFrames = $("viewerFrames");

        const LAST_KEY = "nusaspace_last_module";

        function showViewer(app) {
            $("viewerTitle").textContent = app.title;
            // satu iframe per modul, dibuat sekali agar data tidak hilang saat berpindah
            let frame = viewerFrames.querySelector(`[data-module="${app.id}"]`);
            if (!frame) {
                frame = document.createElement("iframe");
                frame.title = app.title;
                frame.dataset.module = app.id;
                frame.className = "absolute inset-0 w-full h-full border-0 bg-white";
                frame.allow = "camera; fullscreen; clipboard-write";
                frame.src = app.url;
                viewerFrames.appendChild(frame);
            }
            viewerFrames.querySelectorAll("iframe").forEach((f) => f.classList.toggle("hidden", f !== frame));
            viewer.classList.remove("hidden");
            viewer.classList.add("flex");
            document.body.classList.add("overflow-hidden");
        }

        function hideViewer() {
            viewer.classList.add("hidden");
            viewer.classList.remove("flex");
            document.body.classList.remove("overflow-hidden");
        }

        function openViewer(app) {
            try { sessionStorage.setItem(LAST_KEY, String(app.id)); } catch (e) {}
            location.hash = "modul-" + app.id;
            showViewer(app);
        }

        function closeViewer() {
            try { sessionStorage.removeItem(LAST_KEY); } catch (e) {}
            history.replaceState(null, "", location.pathname + location.search);
            hideViewer();
        }

        function moduleFromHash() {
            const m = location.hash.match(/^#modul-(\d+)$/);
            return m ? appMenus.find((a) => a.id === Number(m[1]) && a.url && a.visible) : null;
        }

        function restoreLastPage() {
            let app = moduleFromHash();
            if (!app) {
                let id = null;
                try { id = sessionStorage.getItem(LAST_KEY); } catch (e) {}
                app = id && appMenus.find((a) => a.id === Number(id) && a.url && a.visible);
                if (app) history.replaceState(null, "", "#modul-" + app.id);
            }
            if (app) showViewer(app); else hideViewer();
        }

        window.addEventListener("hashchange", () => {
            const app = moduleFromHash();
            if (app) showViewer(app); else hideViewer();
        });

        $("closeViewerBtn").addEventListener("click", closeViewer);

        $("launchAppBtn").addEventListener("click", () => {
            const app = currentApp;
            closeModal();
            if (app.url) openViewer(app);
            else showToast(`Membuka ${app.title}`);
        });
        document.addEventListener("keydown", (e) => {
            if (e.key !== "Escape") return;
            if (!appModal.classList.contains("hidden")) closeModal();
            else if (!viewer.classList.contains("hidden")) closeViewer();
        });

        renderFilters();
        renderGrid();
        lucide.createIcons();
        restoreLastPage();
    </script>
</body>
</html>
